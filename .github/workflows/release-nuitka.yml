name: Release Nuitka

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to, for example v1.0.0"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-22.04"]' || '["self-hosted","Linux","X64","chenhao-ci-x64","ubuntu-22.04"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        run: |
          python -c 'import os; from src.version import __version__; assert os.environ["IS_TAG"] != "true" or os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Run maintained offline regression suite
        run: python scripts/test_release.py
      - name: Check source assets and template rendering
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs-source-smoke
        run: python main.py --smoke-test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-14
            artifact: macos-arm64
          - os: ubuntu-22.04
            artifact: linux-x64

    runs-on: ${{ fromJSON((startsWith(matrix.os, 'ubuntu-') && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["self-hosted","Linux","X64","chenhao-ci-x64","ubuntu-22.04"]' || format('["{0}"]', matrix.os)) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build standalone
        run: python scripts/build_nuitka.py --clean --assume-yes --output-dir dist-nuitka

      - name: Check packaged application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs-package-smoke
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Get-ChildItem dist-nuitka -Recurse -Filter XHS-AI-Publisher.exe | Select-Object -First 1
          if (-not $app) { throw "Packaged executable missing" }
          $process = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }

      - name: Check packaged application (Unix)
        if: runner.os != 'Windows'
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs-package-smoke
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            app="dist-nuitka/XHS-AI-Publisher.app/Contents/MacOS/XHS-AI-Publisher"
          else
            app=$(find dist-nuitka -path '*.dist/XHS-AI-Publisher' -type f -print -quit)
            test -n "$app"
          fi
          "$app" --smoke-test

      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $bundle = Get-ChildItem dist-nuitka -Directory -Filter *.dist | Select-Object -First 1
          if (-not $bundle) { throw "Standalone bundle missing" }
          Compress-Archive -Path $bundle.FullName -DestinationPath dist-release/XHS-AI-Publisher-${{ matrix.artifact }}.zip -Force

      - name: Archive Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-release
          if [ "${{ runner.os }}" = "macOS" ]; then
            bundle="XHS-AI-Publisher.app"
          else
            bundle=$(find dist-nuitka -maxdepth 1 -type d -name '*.dist' -print -quit)
            bundle=$(basename "$bundle")
          fi
          test -d "dist-nuitka/$bundle"
          tar -czf dist-release/XHS-AI-Publisher-${{ matrix.artifact }}.tar.gz -C dist-nuitka "$bundle"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XHS-AI-Publisher-${{ matrix.artifact }}
          path: dist-release/*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite_files: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          make_latest: ${{ !contains(inputs.release_tag || github.ref_name, '-') }}
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
